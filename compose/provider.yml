# Adapted from nmrpeak-repro: the provider owns network credentials; the
# scientific worker has no network and receives only private input paths.
services:
  provider:
    image: "${PROVIDER_IMAGE_REF:?set the built provider image ID}"
    pull_policy: never
    restart: unless-stopped
    init: true
    user: "${PROVIDER_UID:?set the owning nonroot UID}:${PROVIDER_GID:?set its GID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    cpus: 1
    mem_limit: 512m
    memswap_limit: 512m
    # Covers the example's longest input transfer plus stop acknowledgement.
    stop_grace_period: 1900s
    depends_on:
      worker: {condition: service_started}
      sources-init: {condition: service_completed_successfully}
      session-init: {condition: service_completed_successfully}
    networks: [provider-egress]
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    volumes:
      - type: bind
        source: "${PROVIDER_CONFIG_DIRECTORY:?set the provider TOML and CA directory}"
        target: /run/config/provider
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: "${INTERPRETER_KEY_FILE:?set the interpreter API key file}"
        target: /run/secrets/provider/interpreter.key
        read_only: true
        bind: {create_host_path: false}
      - type: volume
        source: lifetime
        target: /state
        volume: {nocopy: true}
      - type: volume
        source: sources
        target: /run/secs/sources
        volume: {nocopy: true}
      - type: volume
        source: session
        target: /run/secs/worker
        read_only: true
        volume: {nocopy: true}
    logging:
      driver: json-file
      options: {max-file: "3", max-size: 10m}

  worker:
    image: "${WORKER_IMAGE_REF:?set the built GPU package image ID}"
    pull_policy: never
    restart: unless-stopped
    init: true
    depends_on:
      sources-init: {condition: service_completed_successfully}
      session-init: {condition: service_completed_successfully}
    user: "${PROVIDER_UID:?set the owning nonroot UID}:${PROVIDER_GID:?set its GID}"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    cpus: 8
    mem_limit: 64g
    memswap_limit: 64g
    stop_grace_period: 20s
    environment:
      HF_HUB_CACHE: /cache/hub
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_MODULES_CACHE: /modules
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TORCHINDUCTOR_CACHE_DIR: /tmp/torchinductor
      OMP_NUM_THREADS: "8"
      OPENBLAS_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
      - /modules:rw,nosuid,nodev,noexec,size=16m,mode=1777
    volumes:
      - type: bind
        source: "${WORKER_CONFIG_FILE:?set the worker TOML file}"
        target: /run/config/worker/worker.toml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: "${CHECKPOINT_DIRECTORY:?set the existing complete checkpoint directory}"
        target: /checkpoint
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: "${MOLFORMER_CACHE_DIRECTORY:?set the existing verified model cache}"
        target: /cache
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: "${MOLFORMER_LOCK_FILE:?set the pinned model cache lock}"
        target: /input/molformer.lock.toml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: "${CACHE_VERIFIER_FILE:?set tools/materialize_molformer_cache.py}"
        target: /opt/materialize.py
        read_only: true
        bind: {create_host_path: false}
      - type: volume
        source: sources
        target: /run/secs/sources
        volume: {nocopy: true}
      - type: volume
        source: session
        target: /run/secs/worker
        volume: {nocopy: true}
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        python -P /opt/materialize.py --verify-only --lock /input/molformer.lock.toml --output /cache &&
        mkdir -m 700 /tmp/native-config /tmp/native-scratch /tmp/native-status &&
        python -I -m secs_inference.provider.worker_config_snapshot &&
        exec python -I -m provider_core.runner --role secs
        --socket /run/secs/worker/worker.sock --scratch /tmp/native-scratch
        --status-directory /tmp/native-status --owner-session-lifetime
        --startup-seconds 2 --terminate-seconds 2 --kill-seconds 2 --cleanup-seconds 2
        -- python -I -m secs_inference.provider.worker_model
    logging:
      driver: json-file
      options: {max-file: "3", max-size: 10m}

  sources-init:
    image: "${PROVIDER_IMAGE_REF:?set the built provider image ID}"
    user: "0:0"
    network_mode: none
    read_only: true
    restart: "no"
    pids_limit: 16
    cpus: 1
    mem_limit: 128m
    memswap_limit: 128m
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    entrypoint: [python, -P, -m, secs_inference.provider.volume_init]
    command: [sources, "${PROVIDER_UID}", "${PROVIDER_GID}"]
    volumes:
      - type: volume
        source: sources
        target: /sources
        volume: {nocopy: true}
      - type: volume
        source: session
        target: /session
        volume: {nocopy: true}

  session-init:
    image: "${PROVIDER_IMAGE_REF:?set the built provider image ID}"
    user: "${PROVIDER_UID}:${PROVIDER_GID}"
    network_mode: none
    read_only: true
    restart: "no"
    pids_limit: 16
    cpus: 1
    mem_limit: 128m
    memswap_limit: 128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      sources-init: {condition: service_completed_successfully}
    entrypoint: [python, -P, -m, secs_inference.provider.volume_init]
    command: [session]
    volumes:
      - type: volume
        source: session
        target: /session
        volume: {nocopy: true}

volumes:
  sources:
    labels: {io.secs.deployment: "${SECS_DEPLOYMENT}", io.secs.checkout: "${SECS_CHECKOUT}"}
  lifetime:
    labels: {io.secs.deployment: "${SECS_DEPLOYMENT}", io.secs.checkout: "${SECS_CHECKOUT}"}
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64k,uid=${PROVIDER_UID},gid=${PROVIDER_GID},mode=0700,noexec,nosuid,nodev"
  session:
    labels: {io.secs.deployment: "${SECS_DEPLOYMENT}", io.secs.checkout: "${SECS_CHECKOUT}"}

networks:
  # The controller uses configured HTTPS destinations. This bridge is not an
  # engine-enforced destination allowlist; the worker is not attached to it.
  provider-egress:
    driver: bridge
